# =============================================================================
# Your App — SonarQube Scanner Configuration
# ✏️ Replace CHANGE_ME values with your own from Welcome Email
# =============================================================================

# ✏️ SonarQube project key  (Email: "SonarQube Project Key")
# Example: 24010988a-project
sonar.projectKey=CHANGE_ME_SONAR_PROJECT_KEY

# ✏️ Your project/app name (any human-readable name)
sonar.projectName=CHANGE_ME_APP_DISPLAY_NAME

sonar.projectVersion=1.0.0

# Source directories (keep Backend + Frontend if both exist)
sonar.sources=Backend,Frontend

# Source encoding
sonar.sourceEncoding=UTF-8

# Excluded folders (do not modify)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.js,**/*.spec.js
