# =============================================================================
# Skilli DevOps Lab - SonarQube Scanner Configuration
# Fill in your project key from your welcome email!
# =============================================================================

# Mandatory: Your assigned SonarQube Project Key from Welcome Email
# Example: mca-2401060-project or mca-testing-project
sonar.projectKey=CHANGE_ME_SONAR_PROJECT_KEY

# Project display name in SonarQube web UI
sonar.projectName=Student CI/CD Project

# Project version
sonar.projectVersion=1.0.0

# Path to source directories (relative to repository root)
sonar.sources=src

# Encoding of the source code files
sonar.sourceEncoding=UTF-8

# Exclude third-party libraries, vendor files, and build artifacts from scanning
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.js,**/*.spec.js

# Optional: Path to unit test files
# sonar.tests=tests
# sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Optional: Coverage reports path (if using jest/nyc)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
