# =============================================================================
# Skilli DevOps Lab - Fullstack Multi-Tier Kubernetes Manifests
# Tier 1: Backend API (Deployment + Service)
# Tier 2: Frontend UI  (Deployment + Service)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. BACKEND API DEPLOYMENT
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: CHANGE_ME_K8S_NAMESPACE
  labels:
    app: student-app
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app
      tier: backend
  template:
    metadata:
      labels:
        app: student-app
        tier: backend
    spec:
      containers:
        - name: backend
          # Jenkins builds and replaces this image
          image: CHANGE_ME_NEXUS_REGISTRY/CHANGE_ME_NEXUS_IMAGE_PATH/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# -----------------------------------------------------------------------------
# 2. BACKEND CLUSTERIP SERVICE (Internal DNS: http://backend-service:5000)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: CHANGE_ME_K8S_NAMESPACE
  labels:
    app: student-app
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: student-app
    tier: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# -----------------------------------------------------------------------------
# 3. FRONTEND UI DEPLOYMENT
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: CHANGE_ME_K8S_NAMESPACE
  labels:
    app: student-app
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app
      tier: frontend
  template:
    metadata:
      labels:
        app: student-app
        tier: frontend
    spec:
      containers:
        - name: frontend
          # Jenkins builds and replaces this image
          image: CHANGE_ME_NEXUS_REGISTRY/CHANGE_ME_NEXUS_IMAGE_PATH/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# -----------------------------------------------------------------------------
# 4. FRONTEND CLUSTERIP SERVICE
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: CHANGE_ME_K8S_NAMESPACE
  labels:
    app: student-app
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: student-app
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
