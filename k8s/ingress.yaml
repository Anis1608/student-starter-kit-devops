apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  # ===========================================================================
  # REPLACE WITH YOUR NAMESPACE FROM WELCOME EMAIL (e.g., student-mca-2401060)
  # ===========================================================================
  namespace: CHANGE_ME_K8S_NAMESPACE
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # ===========================================================================
  # TLS / HTTPS CONFIGURATION
  # Host must match the assigned application URL domain from your email
  # Example: mca-2401060.imcc.skilli.in (without https://)
  # ===========================================================================
  tls:
    - hosts:
        - CHANGE_ME_APPLICATION_DOMAIN
      secretName: student-app-tls
  rules:
    - host: CHANGE_ME_APPLICATION_DOMAIN
      http:
        paths:
          # ===================================================================
          # 1. API REQUESTS -> BACKEND SERVICE (For Fullstack Apps)
          # All requests starting with /api (e.g. /api/login, /api/users)
          # are automatically forwarded to backend-service on port 5000.
          # ===================================================================
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

          # ===================================================================
          # 2. FRONTEND / UI REQUESTS (Root Path)
          # All webpage requests / static files are sent to frontend-service.
          # (If you only have a single service, change name to 'my-app-service')
          # ===================================================================
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

