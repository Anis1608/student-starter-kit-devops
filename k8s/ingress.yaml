apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  # ✏️ Your Kubernetes namespace (Email: "Kubernetes Namespace")
  # Example: student-24010988a
  namespace: CHANGE_ME_K8S_NAMESPACE
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # ✏️ Your live domain (Email: "Application Domain")
        # Example: 24010988a.imcc.skilli.in
        - CHANGE_ME_APPLICATION_DOMAIN
      secretName: student-app-tls
  rules:
    - host: CHANGE_ME_APPLICATION_DOMAIN   # ✏️ Same domain as above
      http:
        paths:
          # ─── API requests → Backend Service ────────────────────────────────
          # All requests starting with /api go to backend pod (port 5000)
          # e.g. /api/login, /api/products, /api/users
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

          # ─── Frontend / UI requests → Frontend Service ──────────────────────
          # All other requests (/, /home, /about, static files) → nginx frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
