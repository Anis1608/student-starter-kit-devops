apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  # ===========================================================================
  # REPLACE WITH YOUR NAMESPACE FROM WELCOME EMAIL (e.g., student-mca-2401060)
  # ===========================================================================
  namespace: CHANGE_ME_K8S_NAMESPACE
  labels:
    app: my-app
spec:
  type: ClusterIP
  selector:
    # Must match spec.selector.matchLabels in deployment.yaml
    app: my-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
