# =============================================================================
# Skilli DevOps Lab — Fullstack Local Development (Docker Compose)
# Test your Frontend + Backend + Database locally before pushing to Jenkins
#
# 🔒 SECURITY NOTE:
# Sensitive environment variables are loaded from 'Backend/.env'.
# Your '.env' file is protected by .gitignore and will NEVER be pushed to GitHub!
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND API SERVICE (Express / Node.js)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: student-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Load secrets from local Backend/.env if it exists
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/studentdb}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
    networks:
      - student-network
    depends_on:
      - mongo

  # ---------------------------------------------------------------------------
  # 2. FRONTEND UI SERVICE (Nginx + SPA)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - student-network
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # 3. DATABASE (Local MongoDB Container)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:6-jammy
    container_name: student-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - student-network

networks:
  student-network:
    driver: bridge

volumes:
  mongo-data:
